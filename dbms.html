<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Database Management & Warehousing</title><link rel="stylesheet" href="style.css"></head><body><div id="app"></div><script>const M={"id": "dbms", "icon": "🗄️", "name": "Database Management & Warehousing", "topics": [{"n": "ER model", "t": 3, "f": 2, "p": ["Cardinality 1:1, 1:N, M:N; participation total/partial", "Weak entity needs owner + partial key", "M:N relation → separate table", "Composite key from both entity keys"], "k": "Min tables for ER = entities + M:N relations", "y": "Count tables/keys from ER", "e": "An ER diagram models entities, attributes and relationships before you make tables.", "x": "Student–Enrolls–Course is M:N → 3 tables: Student, Course, Enrolls(sid,cid). Employee–WorksIn–Dept is N:1 → just add dno as a foreign key in Employee (2 tables)."}, {"n": "Relational algebra & Tuple calculus", "t": 4, "f": 3, "p": ["σ select, π project (removes duplicates), ⋈ join, ÷ division", "Natural join with no common attr = cross product |R|×|S|", "Division answers 'for all' queries", "Tuple calculus: {t | P(t)}, safe expressions"], "k": "Translate to SQL mentally to verify", "y": "Result size, equivalent expressions", "e": "Relational algebra is the procedural math behind SQL.", "x": "R(A,B)={(1,x),(2,y),(2,z)}: π_A(R)={1,2} (duplicates removed). σ_A=2(R) returns 2 rows. 'Students who took ALL courses' = Enrolls ÷ Course."}, {"n": "SQL", "t": 5, "f": 3, "p": ["WHERE filters rows; HAVING filters groups", "COUNT(*) counts NULL rows; COUNT(col) ignores NULL", "NULL comparisons are UNKNOWN", "Outer joins keep unmatched rows", "Correlated subquery runs per outer row"], "k": "Compute output table by hand", "y": "Query output, aggregates with NULL", "e": "Logical SQL order: FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY.", "x": "Dept A salaries 40k,70k (avg 55k); dept B 30k,40k (avg 35k). HAVING AVG(sal)>50000 keeps only A. sal = NULL is never true; use IS NULL."}, {"n": "Integrity & Normal forms", "t": 6, "f": 3, "p": ["Closure X+ finds keys", "2NF: no partial dependency; 3NF: for X→A, X superkey or A prime", "BCNF: every non-trivial determinant is a superkey", "Lossless join + dependency preservation check", "Primary/foreign key referential integrity"], "k": "Find all candidate keys FIRST", "y": "Highest normal form, number of keys", "e": "Normalization removes redundancy using functional dependencies (FDs). Always find keys first.", "x": "R(A,B,C,D), AB→C, C→D. (AB)+=ABCD so AB is the key. C→D: C is not a superkey and D is non-prime → violates 3NF. Decompose: R1(C,D), R2(A,B,C) (lossless)."}, {"n": "File organization & Indexing", "t": 4, "f": 2, "p": ["Blocking factor = floor(block/record)", "Blocks = ceil(records/BF)", "Primary (ordered key), clustering, secondary index", "Dense index: entry per record; sparse: per block", "B+ tree: data in leaves, linked leaves"], "k": "Use formulas with floor/ceil carefully", "y": "Block counts, index size", "e": "Records live in disk blocks; an index is a small sorted table pointing to blocks, which cuts block reads.", "x": "Block 4096 B, record 256 B → BF=16. 10,000 records → 625 blocks. Binary search on the data file reads ⌈log2 625⌉ = 10 blocks."}, {"n": "Data transformation", "t": 3, "f": 2, "p": ["Min-max: (v-min)/(max-min)*(new range)+new min", "Z-score: (v-μ)/σ", "Discretization: equal-width / equal-frequency binning", "Sampling with/without replacement; compression lossy/lossless"], "k": "Plug numbers directly", "y": "Normalization value, binning smoothing", "e": "Preprocessing makes attributes comparable and data smaller.", "x": "Ages 20,30,50. Min-max [0,1]: 0, 0.33, 1. Mean 33.3, σ≈12.47 → z(50)≈1.34. Equal-width bins of width 10: [20,30) [30,40) [40,50]."}, {"n": "Data warehouse & OLAP", "t": 4, "f": 3, "p": ["Star: fact + denormalized dims; Snowflake: normalized dims", "Fact constellation: multiple facts share dims", "OLAP: roll-up, drill-down, slice, dice, pivot", "Cuboids with n dims (no hierarchy)=2^n; with hierarchies Π(Li+1)", "Measures: distributive (sum,count), algebraic (avg), holistic (median)"], "k": "Memorise measure categories", "y": "Cuboid count, schema type, measure type", "e": "A warehouse stores history for analysis; a cube shows measures across dimensions.", "x": "Sales(time,item,location), no hierarchies → 2^3 = 8 cuboids. With levels time(day<month<year)=3, item=1, location(city<country)=2 → (3+1)(1+1)(2+1)=24 cuboids."}], "q": [["R(A,B,C,D), A→B, B→C, C→D. Highest normal form?", ["1NF", "2NF", "3NF", "BCNF"], 1, "Key A; transitive dependencies break 3NF."], ["Column has 5 rows with 2 NULLs. COUNT(col)?", ["5", "3", "2", "0"], 1, "COUNT(col) ignores NULLs."], ["Cuboids in a 4-dimension cube without hierarchies?", ["8", "16", "4", "32"], 1, "2^4 = 16."], ["Min-max normalize 40 from [20,60] to [0,1]?", ["0.25", "0.5", "0.75", "1"], 1, "(40-20)/40 = 0.5."], ["Block 1024 B, record 128 B, 1000 records. Blocks needed?", ["100", "125", "128", "1000"], 1, "BF=8; 1000/8=125."], ["Snowflake schema differs from star because", ["Fewer dims", "Normalized dimension tables", "No fact table", "Multiple facts"], 1, "Dimensions are split into sub-tables."], ["R has 10 tuples, S 20, no common attributes. |R ⋈ S|?", ["30", "200", "10", "0"], 1, "Cross product."], ["Which measure is holistic?", ["SUM", "COUNT", "AVG", "MEDIAN"], 3, "Median can't be computed from partial aggregates."], ["BCNF requires non-trivial X→Y to have", ["Y prime", "X superkey", "X prime", "Y key"], 1, "Determinant must be a superkey."]]}</script><script src="app.js"></script></body></html>
